services:
  - type: web
    name: la-cosecha-api
    runtime: python
    rootDir: la_cosecha
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: la-cosecha-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NOMBRE
        value: Marta Ruiz
      - key: ADMIN_CORREO
        value: marta@lacosecha.com
      - key: ADMIN_CONTRASENA
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  - name: la-cosecha-db
    databaseName: la_cosecha
    plan: free
